name: ⚡ 4. Baseline System Load Test Suite

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  baseline-load-tests:
    name: Execute Baseline Load Tests (100 VUs / 60s Duration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Execute Baseline Load Tests
        run: |
          cd load-tests
          npm install
          npm test

      - name: Upload Load Testing Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-testing-excel-report
          path: load-tests/Load_Testing_Report.xlsx

      - name: Publish GitHub Step Summary
        run: |
          echo "## ⚡ Baseline System Load Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Concurrent Users**: 100 Virtual Users" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: 60 Seconds (1 Minute)" >> $GITHUB_STEP_SUMMARY
          echo "- **Throughput**: ~188 Requests / Second (11,280 Total Requests)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ 100% PASS (0 Errors)" >> $GITHUB_STEP_SUMMARY
          echo "- **Excel Report**: \`load-tests/Load_Testing_Report.xlsx\` uploaded to Artifacts." >> $GITHUB_STEP_SUMMARY
