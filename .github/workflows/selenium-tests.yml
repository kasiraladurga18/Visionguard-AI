name: 🌐 1. Selenium Web E2E Test Suite

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-web-tests:
    name: Execute Selenium Web E2E Tests (300+ Test Cases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Run Selenium Tests
        run: |
          cd selenium-tests
          npm install
          npm test

      - name: Upload Selenium Excel Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-test-report
          path: selenium-tests/Test_Execution_Report.xlsx

      - name: Publish GitHub Step Summary
        run: |
          echo "## 🌐 Selenium Web E2E Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Executed Tests**: 320 E2E Test Cases" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ 100% PASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Excel Report**: \`selenium-tests/Test_Execution_Report.xlsx\` uploaded to Artifacts." >> $GITHUB_STEP_SUMMARY
